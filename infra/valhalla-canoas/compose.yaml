name: novaesweb-mapas-canoas
services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted@sha256:2dab557c4786a411d6eb814f2bf6f927e56ff8b89df4b9412c89437fe59f93d9
    container_name: novaesweb-valhalla-canoas
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - mapa-canoas:/custom_files
    environment:
      server_threads: "2"
      build_elevation: "False"
      build_admins: "False"
      build_time_zones: "False"
      use_default_speeds_config: "False"
      use_tiles_ignore_pbf: "True"
      build_tar: "True"
    mem_limit: 3g
volumes:
  mapa-canoas:
    external: true
    name: novaesweb-valhalla-canoas-data

