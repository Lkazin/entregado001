services:
  nominatim:
    image: mediagis/nominatim:5.3
    container_name: novaesweb-geocoder-canoas
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8080"
    volumes:
      - ./custom_files/canoas.osm.pbf:/data/canoas.osm.pbf:ro
      - geocoder-canoas:/var/lib/postgresql/16/main
    env_file:
      - ./.secrets/nominatim.env
    environment:
      PBF_PATH: /data/canoas.osm.pbf
      IMPORT_STYLE: address
      THREADS: "2"
      GUNICORN_WORKERS: "2"
      UPDATE_MODE: none
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_MAINTENANCE_WORK_MEM: 256MB
      POSTGRES_AUTOVACUUM_WORK_MEM: 128MB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      NOMINATIM_SERVE_DEBUG_OUTPUT: "no"
    shm_size: 256m
    mem_limit: 3g
volumes:
  geocoder-canoas:
    name: novaesweb-geocoder-canoas-data
