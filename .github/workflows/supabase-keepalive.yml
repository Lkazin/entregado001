name: Supabase keepalive (Entregador / Bella Pizza)

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive-entregador
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validar configuração
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ENTREGADOR_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure o secret ENTREGADOR_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi

      - name: Consulta mínima de leitura no banco
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ENTREGADOR_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          url="https://ngrkqutqmlhdenrxyaos.supabase.co/rest/v1/order_delivery_ratings?select=id&limit=0"
          # O endpoint consulta uma tabela existente, sem retornar dados pessoais.
          # Usa somente chave publishable/anon; NUNCA use service_role.
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              "$url") || status="000"
            if [ "$status" = "200" ] || [ "$status" = "206" ]; then
              echo "Consulta Supabase concluída (HTTP $status)."
              exit 0
            fi
            echo "Tentativa $attempt: HTTP $status."
            sleep 5
          done
          echo "::error::Não foi possível realizar a consulta ao Supabase."
          exit 1
